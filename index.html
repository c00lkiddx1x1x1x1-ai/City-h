<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>City Shop</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Overlay -->
    <div class="overlay"></div>

    <!-- Main Container -->
    <main class="container">

        <!-- Glass Card -->
        <div class="shop-card">

            <h1>City Shop</h1>

            <p class="subtitle">Welcome to City Shop</p>

            <!-- Order Button -->
            <button id="orderBtn" class="order-btn">
                Order
            </button>

        </div>

    </main>

    <!-- Car Animation -->
    <div id="car" class="car">
        <div class="car-body">
            <span>ORDER</span>
        </div>

        <div class="wheel wheel-left"></div>
        <div class="wheel wheel-right"></div>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
